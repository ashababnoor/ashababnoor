<svg xmlns="http://www.w3.org/2000/svg" width="397" height="165" viewBox="0 0 397 165" role="img" aria-labelledby="t">
  <title id="t">Ahmed Shabab Noor — Software &amp; Data Engineer. Backend systems, data pipelines, AI and machine learning.</title>
  <style>
    .bg    { fill: #F6F8FB; }
    .name  { fill: #0B1220; }
    .role  { fill: #4B5568; }
    .tag   { fill: #4B5568; }
    .path  { fill: #15803D; stroke: #15803D; stroke-width: 0.35; stroke-linejoin: round; }
    .path .tag { stroke: #4B5568; }
    .tagr  { fill: #4B5568; }
    .halo  { fill: #F6F8FB; stroke: #F6F8FB; stroke-width: 2.5; stroke-linejoin: round; opacity: .5; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 55% { fill-opacity: 1; stroke-opacity: 1; } 56%, 100% { fill-opacity: 0; stroke-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    .blob1 { fill: #00D4AA; fill-opacity: .55; }
    .blob2 { fill: #6366F1; fill-opacity: .40; }
    .blob3 { fill: #38BDF8; fill-opacity: .45; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #121212; }
      .name  { fill: #E0E0E0; }
      .role  { fill: #B8B8B8; }
      .tag   { fill: #B8B8B8; }
      .path  { fill: #4ADE80; stroke: none; }
      .path .tag { stroke: none; }
      .tagr  { fill: #B8B8B8; }
      .halo  { fill: #121212; stroke: #121212; opacity: .28; }
      .bar   { fill: #00D4AA; }
      .blob1 { fill-opacity: .45; }
      .blob2 { fill-opacity: .50; }
      .blob3 { fill-opacity: .35; }
    }
  </style>
  <defs>
    <filter id="soft" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="21.6"/>
    </filter>
    <clipPath id="card"><rect width="397" height="165"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect class="bg" width="397" height="165"/>
    <g filter="url(#blur)">
      <ellipse class="blob1" cx="327" cy="28"  rx="95" ry="57"/>
      <ellipse class="blob2" cx="369" cy="130" rx="82" ry="49"/>
      <ellipse class="blob3" cx="257" cy="149" rx="70" ry="37"/>
    </g>
  </g>

  <text class="path" x="30.75" y="31.38" font-size="14" letter-spacing="1" font-family="'Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace">~/shabab <tspan class="tag">$</tspan> <tspan class="cursor">_</tspan></text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
    <text class="name" x="30.5" y="79" font-size="32" font-weight="700" letter-spacing="-1">Ahmed Shabab Noor</text>
    <text class="role" x="30" y="105.25" font-size="18" font-weight="500" letter-spacing="0.2">Software &amp; Data Engineer</text>
  </g>
  <text class="halo" filter="url(#soft)" x="29.75" y="141.62" font-size="14" font-family="'Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Backend systems · Data pipelines · AI/ML</text>
  <text class="tagr" x="29.75" y="141.62" font-size="14" font-family="'Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Backend systems · Data pipelines · AI/ML</text>
</svg>
