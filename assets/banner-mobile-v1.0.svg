<svg xmlns="http://www.w3.org/2000/svg" width="390" height="168" viewBox="0 0 390 168" role="img" aria-labelledby="t">
  <title id="t">Ahmed Shabab Noor — Software &amp; Data Engineer. Backend systems, data pipelines, AI and machine learning.</title>
  <style>
    .bg    { fill: #F6F8FB; }
    .name  { fill: #0B1220; }
    .role  { fill: #4B5568; }
    .tag   { fill: #6B7488; }
    .path  { fill: #15803D; }
    .tagr  { fill: #636D80; }
    .halo  { fill: #F6F8FB; stroke: #F6F8FB; stroke-width: 2.5; stroke-linejoin: round; opacity: .5; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 55% { fill-opacity: 1; } 56%, 100% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    .blob1 { fill: #00D4AA; fill-opacity: .55; }
    .blob2 { fill: #6366F1; fill-opacity: .40; }
    .blob3 { fill: #38BDF8; fill-opacity: .45; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #121212; }
      .name  { fill: #E0E0E0; }
      .role  { fill: #B8B8B8; }
      .tag   { fill: #949494; }
      .path  { fill: #4ADE80; }
      .tagr  { fill: #9D9D9D; }
      .halo  { fill: #121212; stroke: #121212; opacity: .28; }
      .bar   { fill: #00D4AA; }
      .blob1 { fill-opacity: .45; }
      .blob2 { fill-opacity: .50; }
      .blob3 { fill-opacity: .35; }
    }
  </style>
  <defs>
    <filter id="soft" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="card"><rect width="390" height="168"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect class="bg" width="390" height="168"/>
    <g filter="url(#blur)">
      <ellipse class="blob1" cx="320" cy="28"  rx="95" ry="58"/>
      <ellipse class="blob2" cx="362" cy="132" rx="82" ry="50"/>
      <ellipse class="blob3" cx="250" cy="152" rx="70" ry="38"/>
    </g>
  </g>

  <text class="path" x="24" y="35.5" font-size="15" letter-spacing="1" font-family="'Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace">~/shabab <tspan class="tag">$</tspan> <tspan class="cursor">_</tspan></text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
    <text class="name" x="22" y="83.5" font-size="29" font-weight="700" letter-spacing="-1">Ahmed Shabab Noor</text>
    <text class="role" x="24" y="109.5" font-size="17" font-weight="500" letter-spacing="0.2">Software &amp; Data Engineer</text>
  </g>
  <text class="halo" filter="url(#soft)" x="24" y="141.5" font-size="13.5" font-family="'Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Backend systems · Data pipelines · AI/ML</text>
  <text class="tagr" x="24" y="141.5" font-size="13.5" font-family="'Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Backend systems · Data pipelines · AI/ML</text>
</svg>
