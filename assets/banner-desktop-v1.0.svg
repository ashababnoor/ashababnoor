<svg xmlns="http://www.w3.org/2000/svg" width="846" height="139" viewBox="0 0 846 139" role="img" aria-labelledby="t">
  <title id="t">Ahmed Shabab Noor — Software &amp; Data Engineer. Backend systems, data pipelines, AI and machine learning.</title>
  <style>
    .bg    { fill: #F6F8FB; }
