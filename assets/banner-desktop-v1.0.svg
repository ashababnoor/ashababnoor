    .role  { fill: #4B5568; }
    .tag   { fill: #636D80; }
    .path  { fill: #15803D; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 55% { fill-opacity: 1; } 56%, 100% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    .blob1 { fill: #00D4AA; fill-opacity: .55; }
    .blob2 { fill: #6366F1; fill-opacity: .40; }
    .blob3 { fill: #38BDF8; fill-opacity: .45; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #121212; }
      .name  { fill: #E0E0E0; }
      .role  { fill: #B8B8B8; }
      .tag   { fill: #949494; }
      .path  { fill: #4ADE80; }
      .bar   { fill: #00D4AA; }
      .blob1 { fill-opacity: .45; }
      .blob2 { fill-opacity: .50; }
      .blob3 { fill-opacity: .35; }
    }
  </style>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30.3"/>
    </filter>
    <clipPath id="card"><rect width="846" height="139"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
